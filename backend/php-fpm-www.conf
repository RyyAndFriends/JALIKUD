; Laravel worker pool. Replaces the stock www.conf so the listen socket is
; explicit and matches backend/nginx.conf's fastcgi_pass (127.0.0.1:9000).
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Route worker output to the FPM master log so supervisord captures it.
catch_workers_output = yes
clear_env = no
