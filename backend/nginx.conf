# Backend nginx: serves the Laravel app (public/) and, through the
# public/storage symlink, uploaded files from the `uploads` volume.
# Listens on 8000 so the frontend nginx and cloudflared keep proxying to
# `backend:8000` unchanged.
server {
    listen 8000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Keep in sync with UploadImageRequest / UploadDocumentRequest (5 MB images).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Forward proxy headers to PHP-FPM. The stock fastcgi_params does not
        # pass X-Forwarded-*, and without them TrustProxies would report the
        # frontend nginx IP as the client and collapse every client into one
        # shared rate-limit bucket (see AppServiceProvider::boot).
        fastcgi_param HTTP_X_FORWARDED_FOR    $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO  $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST   $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT   $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PREFIX $http_x_forwarded_prefix;

        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
